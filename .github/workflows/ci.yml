name: CI

on:
  push:
    branches: [ main, "repair/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      code_sha:
        description: 'Exact commit SHA to benchmark'
        required: false
        default: ''

jobs:
  matrix-compatibility:
    name: Compatibility Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linting
        run: |
          ruff check .

      - name: Run Ruff Format Check
        run: |
          ruff format --check .

      - name: Run Mypy Type Checking
        run: |
          mypy toolspeed tests

      - name: Run Bandit Security Analysis
        run: |
          bandit -r toolspeed -s B101,B110,B404,B602,B603

      - name: Run Unit Tests with Coverage
        run: |
          pytest --cov=toolspeed --cov-report=term-missing --cov-fail-under=80

      - name: Run Adversarial Mutation Integrity Tests
        run: |
          pytest tests/test_behavioral_mutation_integrity.py -v

      - name: Run Scientific Integrity Tests
        run: |
          pytest tests/test_scientific_integrity.py -v

      - name: Run Review Findings Tests
        run: |
          pytest tests/test_review_findings.py -v

      - name: Build Wheel Distribution Package & Check Twine
        run: |
          python -m build --wheel
          twine check dist/*

      - name: Install Wheel in Clean Environment & Run CLI Smoke Test
        run: |
          python -m venv /tmp/clean_env
          /tmp/clean_env/bin/pip install --upgrade pip
          /tmp/clean_env/bin/pip install dist/*.whl
          /tmp/clean_env/bin/toolspeed --help
          /tmp/clean_env/bin/toolspeed simulate --trials 5 --out /tmp/wheel_smoke_bundle
          /tmp/clean_env/bin/toolspeed validate-bundle --input /tmp/wheel_smoke_bundle

  benchmark-smoke:
    name: Benchmark Smoke (Python 3.12, Non-Verdict-Eligible)
    runs-on: ubuntu-latest
    needs: [matrix-compatibility]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Synthetic Simulation Smoke
        run: |
          python -m toolspeed.cli simulate --trials 10 --out /tmp/smoke-synthetic

      - name: Run Replay Benchmark Smoke (10 trials)
        run: |
          python -m toolspeed.cli benchmark --backend replay --trials 10 --out /tmp/smoke-replay

      - name: Run Local Wall-Clock Benchmark Smoke (10 trials)
        run: |
          python -m toolspeed.cli benchmark --backend local --trials 10 --out /tmp/smoke-local

      - name: Validate Smoke Bundles
        run: |
          python -m toolspeed.cli validate-bundle --input /tmp/smoke-replay
          python -m toolspeed.cli validate-bundle --input /tmp/smoke-local

      - name: Assert Falsify Exit Code 2 on Smoke Run
        run: |
          python -m toolspeed.cli falsify --input /tmp/smoke-replay || [ $? -eq 2 ]
          python -m toolspeed.cli falsify --input /tmp/smoke-local || [ $? -eq 2 ]

      - name: Confirm Clean Tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after smoke benchmarks!"
            git status --porcelain
            exit 1
          fi

  full-evidence:
    name: Full Evidence Sweep (Replay 1000 & Local 200)
    runs-on: ubuntu-latest
    needs: [benchmark-smoke]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.code_sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Confirm Clean Tree Before Execution
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Tree dirty before run!"
            exit 1
          fi

      - name: Run Deterministic Replay Benchmark (1,000 trials)
        run: |
          python -m toolspeed.cli benchmark --backend replay --trials 1000 --out /tmp/evidence-replay

      - name: Validate Replay Bundle
        run: |
          python -m toolspeed.cli validate-bundle --input /tmp/evidence-replay

      - name: Falsification on Replay Bundle
        run: |
          python -m toolspeed.cli falsify --input /tmp/evidence-replay || [ $? -le 2 ]

      - name: Run Local Wall-Clock Benchmark (200 trials)
        run: |
          python -m toolspeed.cli benchmark --backend local --trials 200 --out /tmp/evidence-local

      - name: Validate Local Bundle
        run: |
          python -m toolspeed.cli validate-bundle --input /tmp/evidence-local

      - name: Falsification on Local Bundle
        run: |
          python -m toolspeed.cli falsify --input /tmp/evidence-local || [ $? -le 2 ]

      - name: Confirm Clean Tree After Execution
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Tree dirty after evidence generation!"
            git status --porcelain
            exit 1
          fi

      - name: Upload Replay Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-evidence-bundle
          path: /tmp/evidence-replay

      - name: Upload Local Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-evidence-bundle
          path: /tmp/evidence-local
