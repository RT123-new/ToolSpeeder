name: CI

on:
  push:
    branches: [ main, "repair/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install numpy

      - name: Run Full Unit & Adversarial Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Run 22 Adversarial Scientific Integrity Tests
        run: |
          python -m unittest tests/test_adversarial_integrity.py

      - name: Run Scientific Falsification Evaluator (Synthetic)
        run: |
          python -m toolspeed.cli falsify --trials 150

      - name: Run Deterministic Replay Benchmark Suite
        run: |
          python -m toolspeed.cli benchmark --backend replay --trials 50 --out artifacts/replay

      - name: Run Real Local Wall-Clock Benchmark Suite
        run: |
          python -m toolspeed.cli benchmark --backend local --trials 10 --out artifacts/local
