name: CI

on:
  push:
    branches: [ main, "repair/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linting
        run: |
          ruff check .

      - name: Run Full Unit & Adversarial Test Suite with Coverage
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py"
          coverage report -m

      - name: Run 45 Adversarial Scientific Integrity Tests
        run: |
          python -m unittest tests/test_adversarial_integrity.py

      - name: Run Synthetic Simulation
        run: |
          python -m toolspeed.cli simulate --trials 200 --out artifacts/synthetic

      - name: Run Deterministic Replay Benchmark Suite
        run: |
          python -m toolspeed.cli benchmark --backend replay --trials 1000 --out artifacts/replay

      - name: Validate Replay Result Bundle
        run: |
          python -m toolspeed.cli validate-bundle --input artifacts/replay

      - name: Run Falsification Evaluation on Replay Bundle
        run: |
          python -m toolspeed.cli falsify --input artifacts/replay

      - name: Run Real Local Wall-Clock Benchmark Suite
        run: |
          python -m toolspeed.cli benchmark --backend local --trials 200 --out artifacts/local

      - name: Validate Local Result Bundle
        run: |
          python -m toolspeed.cli validate-bundle --input artifacts/local

      - name: Run Falsification Evaluation on Local Bundle
        run: |
          python -m toolspeed.cli falsify --input artifacts/local

      - name: Build Wheel Distribution Package
        run: |
          python -m build
